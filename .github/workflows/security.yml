name: Credential safety

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - run: bash tests/check_credentials.sh
      - run: shellcheck tests/check_credentials.sh
